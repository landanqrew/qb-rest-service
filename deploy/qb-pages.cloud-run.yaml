# Knative service manifest for qb-pages — the public static-pages companion
# service (landing, EULA, privacy policy) required by Intuit's production-app
# constraints. See docs/qb-service-scope.md §14 (Amendment 2).
#
# Applied via `gcloud run services replace deploy/qb-pages.cloud-run.yaml`
# once the substitutions below are filled in. `deploy/deploy-pages.sh` is the
# easier entrypoint for day-to-day deploys; this file is the declarative
# source of truth for what a deployed revision looks like.
#
# Placeholders (substitute before applying):
#   PROJECT_ID — GCP project hosting Cloud Run
#   IMAGE      — fully-qualified container image, e.g.
#                us-central1-docker.pkg.dev/PROJECT_ID/qb-service/qb-pages:GIT_SHA
#
# Note: `services replace` does not manage invoker IAM. Public access needs a
# one-time binding (deploy-pages.sh's --allow-unauthenticated does this):
#   gcloud run services add-iam-policy-binding qb-pages \
#     --member=allUsers --role=roles/run.invoker --region=REGION

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: qb-pages
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      # Dedicated SA with NO role bindings (iam-setup.md §9) — qb-pages reads
      # no secrets and calls nothing.
      serviceAccountName: qb-pages-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - name: qb-pages
          image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: 8080
            timeoutSeconds: 4
            periodSeconds: 4
            failureThreshold: 10
  traffic:
    - latestRevision: true
      percent: 100
