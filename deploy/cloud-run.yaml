# Knative service manifest for qb-service on Cloud Run — the IAM-locked DATA
# API only. The browser OAuth admin surface (/admin/oauth/*) is disabled here
# (QBSVC_ENABLE_ADMIN_ROUTES=false, issue #52) and served instead by the
# separate public qb-admin service (deploy/qb-admin.cloud-run.yaml).
#
# Applied via `gcloud run services replace deploy/cloud-run.yaml` once the
# substitutions below are filled in. `deploy/deploy.sh` is the easier
# entrypoint for day-to-day deploys; this file is the declarative source
# of truth for what a deployed revision looks like.
#
# Placeholders (substitute before applying):
#   PROJECT_ID        — GCP project hosting Cloud Run + Secret Manager
#   REGION            — Cloud Run region, e.g. us-central1
#   IMAGE             — fully-qualified container image, e.g.
#                       us-central1-docker.pkg.dev/PROJECT_ID/qb-service/qb-service:GIT_SHA
#   REALM_ID          — Intuit realm/company ID
#   SECRET_TOKENS     — Secret Manager secret containing rotated token JSON
#   SECRET_CLIENT_ID  — Secret Manager secret containing Intuit OAuth client ID
#   SECRET_CLIENT_SECRET
#                     — Secret Manager secret containing Intuit OAuth client secret
#
# Secret Manager secrets referenced (see deploy/iam-setup.md):
#   SECRET_CLIENT_ID, SECRET_CLIENT_SECRET, SECRET_TOKENS

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: qb-service
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: qb-service-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: qb-service
          image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          env:
            # Data API only (issue #52): the browser OAuth admin surface
            # (/admin/oauth/*) is NOT hosted on this IAM-locked service. OAuth
            # bootstrap runs on the separate public qb-admin service
            # (deploy/qb-admin.cloud-run.yaml). No QBSVC_OAUTH_REDIRECT_URI or
            # QBSVC_ADMIN_ALLOWLIST here — both are admin-surface concerns.
            - name: QBSVC_ENABLE_ADMIN_ROUTES
              value: "false"
            - name: QBSVC_TOKEN_BACKEND
              value: secret_manager
            - name: QBSVC_GCP_PROJECT
              value: PROJECT_ID
            - name: QBSVC_REALM_ID
              value: REALM_ID
            - name: QBSVC_SECRET_NAME_TOKENS
              value: SECRET_TOKENS
            - name: QBSVC_INTUIT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: SECRET_CLIENT_ID
                  key: latest
            - name: QBSVC_INTUIT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: SECRET_CLIENT_SECRET
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            timeoutSeconds: 4
            periodSeconds: 4
            failureThreshold: 10
  traffic:
    - latestRevision: true
      percent: 100
