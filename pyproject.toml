[project]
name = "qbsvc"
version = "0.1.0"
description = "Thin REST proxy in front of QuickBooks Online for a consuming web app."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
gcp = [
    "google-cloud-secret-manager>=2.20",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "src" for the qbsvc package; "." so the out-of-band scripts/replicate tool
# (not part of the shipped package) is importable by its tests.
pythonpath = ["src", "."]
